name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze TypeScript
    # SARIF upload needs code scanning, which private repositories only get
    # with Advanced Security — this internal repo does not have it, so every
    # run here fails at upload with "Resource not accessible by integration".
    # The workflow ships in the public export, where it runs for real.
    if: github.repository == 'open-e2ee/signal-protocol-js'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: '/language:javascript-typescript'
