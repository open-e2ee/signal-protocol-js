name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1'

permissions:
  contents: read

# A new push to a pull request supersedes the run in flight. A push to main
# never cancels an earlier main run, so every main commit gets a verdict.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze TypeScript
    # SARIF upload needs code scanning, which private repositories only get
    # with Advanced Security — this internal repo does not have it, so every
    # run here fails at upload with "Resource not accessible by integration".
    # The workflow ships in the public export, where it runs for real.
    if: github.repository == 'open-e2ee/signal-protocol-js'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: '/language:javascript-typescript'
