name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, typecheck, and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Must match the npm major used by the release-export pipeline, which
          # regenerates package-lock.json for the transformed manifest; a
          # different npm major computes a different tree and `npm ci` fails.
          node-version: 26
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Check the generated API reference
        run: npm run docs:api:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  quickstart:
    name: README quickstart runs as printed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts

      - name: Build and pack
        run: |
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      - name: Extract the local round-trip block from README.md
        run: |
          awk '/^## Run a local encrypted round trip$/{flag=1} flag && /^```ts$/{code=1; next} code && /^```$/{exit} code{print}' README.md > "$RUNNER_TEMP/quickstart.mjs"
          test -s "$RUNNER_TEMP/quickstart.mjs"

      - name: Run the quickstart against the packed package
        run: |
          mkdir -p "$RUNNER_TEMP/qs" && cd "$RUNNER_TEMP/qs"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/open-e2ee-signal-protocol-sdk-*.tgz
          cp "$RUNNER_TEMP/quickstart.mjs" .
          timeout 120 node quickstart.mjs | tee output.txt || true
          grep -q "alice: hello" output.txt

  csp:
    name: Quickstart runs with code generation disallowed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts

      # Builds, packs, installs into a throwaway consumer, and runs the README
      # Quick Start under `--disallow-code-generation-from-strings`. That flag
      # stands in for `script-src 'self'` and for a Chrome MV3 extension: no
      # dependency may build a codec with `new Function` at runtime. The SDK
      # failed this until the wire codecs stopped using protobufjs reflection.
      - name: Run the eval gate
        run: node ./scripts/smoke-csp.mjs

  import-surface:
    name: Every export subpath imports without optional peers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts

      # Packs, installs into a consumer outside the repo whose node_modules has
      # every optional peer removed, and imports each entry in the export map.
      # `peerDependenciesMeta` marks react-native, the expo-* packages, convex
      # and idb optional, so a consumer may have none of them — but a static
      # import of an absent package throws before the module runs, and every
      # other check here either resolves types without loading a module or runs
      # from inside the repo, where the optional peers are installed.
      - name: Probe the import surface
        run: node ./scripts/smoke-import-surface.mjs

  doc-snippets:
    name: Shipped doc snippets run as printed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts

      - name: Build and pack
        run: |
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      - name: Execute every classified doc snippet
        run: >-
          node scripts/run-doc-snippets.mjs
          "$RUNNER_TEMP"/open-e2ee-signal-protocol-sdk-*.tgz
