name: Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, typecheck, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - name: Report Node.js version
        run: node --version
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm run docs:api:check
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Client cryptography runs with code generation disallowed
        run: node scripts/smoke-csp.mjs --no-build
      - name: Public subpaths import without optional peers
        run: node scripts/smoke-import-surface.mjs --no-build
      - name: Published documentation matches the packed client API
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          node scripts/run-doc-snippets.mjs "$RUNNER_TEMP"/open-e2ee-signal-protocol-sdk-*.tgz
      - name: Supported React Native peer ranges resolve
        run: node scripts/smoke-react-native-install.mjs "$RUNNER_TEMP"/open-e2ee-signal-protocol-sdk-*.tgz
