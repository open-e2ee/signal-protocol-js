name: Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run in flight. A push to main
# never cancels an earlier main run, so every main commit gets a verdict.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A draft pull request runs only `changes` and `build`. The other jobs skip on
# a draft and run when the pull request is marked ready for review. A draft
# cannot merge, so each change runs every job before it reaches main.
#
# A pull request that changes only documentation that no job here reads runs
# only `changes` and the `react-native-hosts` verdict. See `changes`.
jobs:
  # Decides whether the pull request changes only documentation that no job
  # here reads. `scripts/docs-only-change.mjs` of the base revision holds the
  # rule, and each doubt resolves to code. A push and a manual run are always
  # code. An error fails this job: then each job that needs it skips, and each
  # verdict job fails.
  changes:
    name: Changed files are classified (Checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # The base revision classifies, so a change to the classifier or to
      # its allowlist never classifies itself. Only those two files are
      # checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            scripts/docs-only-change.mjs
            scripts/docs-only-paths.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name == 'pull_request'
        with:
          node-version: 26

      # The file list comes from the API, because the checkout holds no
      # history to diff. A rename carries both of its names. A base without
      # the classifier cannot classify, so every job runs.
      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f scripts/docs-only-change.mjs ]; then
            echo "::notice title=Docs-only check skipped::The base revision has no scripts/docs-only-change.mjs, so every job runs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" \
            --jq '.[] | {filename, previous_filename}' > "$RUNNER_TEMP/changed-files.jsonl"
          verdict=$(node ./scripts/docs-only-change.mjs "$CHANGED_FILES" < "$RUNNER_TEMP/changed-files.jsonl")
          case "$verdict" in
            code=true | code=false) echo "$verdict" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected verdict: $verdict" >&2; exit 1 ;;
          esac

  build:
    name: Build, typecheck, and audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        id: node
        uses: ./.github/actions/node

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: node_modules
          key: ${{ steps.node.outputs.node-modules-key }}

      - name: Install from the committed lockfile
        uses: ./.github/actions/install
        with:
          cache-hit: ${{ steps.node-modules.outputs.cache-hit }}

      - name: Save node_modules
        if: steps.node-modules.outcome == 'success' && steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Check the generated API reference
        run: npm run docs:api:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  examples:
    name: Documented examples run against the packed package
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        id: node
        uses: ./.github/actions/node

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: node_modules
          key: ${{ steps.node.outputs.node-modules-key }}

      - name: Install from the committed lockfile
        uses: ./.github/actions/install
        with:
          cache-hit: ${{ steps.node-modules.outputs.cache-hit }}

      - name: Save node_modules
        if: steps.node-modules.outcome == 'success' && steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Build and pack
        id: pack
        run: |
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      # Each check below runs when an earlier check fails, so one failure
      # does not hide the result of the others. A failed check fails the job.
      - name: README quickstart runs as printed
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        run: |
          awk '/^## Run a local encrypted round trip$/{flag=1} flag && /^```ts$/{code=1; next} code && /^```$/{exit} code{print}' README.md > "$RUNNER_TEMP/quickstart.mjs"
          test -s "$RUNNER_TEMP/quickstart.mjs"
          mkdir -p "$RUNNER_TEMP/qs" && cd "$RUNNER_TEMP/qs"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/open-e2ee-signal-protocol-sdk-*.tgz
          cp "$RUNNER_TEMP/quickstart.mjs" .
          set -o pipefail
          timeout 120 node quickstart.mjs | tee output.txt
          grep -q "alice: hello" output.txt

      # Packs the built `dist/`, installs it into a throwaway consumer, and
      # runs the README Quick Start under
      # `--disallow-code-generation-from-strings`. That flag stands in for
      # `script-src 'self'` and for a Chrome MV3 extension: no dependency may
      # build a codec with `new Function` at runtime. The SDK failed this until
      # the wire codecs stopped using protobufjs reflection.
      - name: Quickstart runs with code generation disallowed
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        run: node ./scripts/smoke-csp.mjs --no-build

      # Packs, installs into a consumer outside the repo whose node_modules has
      # every optional peer removed, and imports each entry in the export map.
      # `peerDependenciesMeta` marks react-native, the expo-* packages, convex
      # and idb optional, so a consumer may have none of them — but a static
      # import of an absent package throws before the module runs, and every
      # other check here either resolves types without loading a module or runs
      # from inside the repo, where the optional peers are installed. It also
      # checks that each store and vault guide has an install command for the
      # optional peers that its entry loads.
      - name: Every export subpath imports without optional peers
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        run: node ./scripts/smoke-import-surface.mjs --no-build

      - name: Shipped doc snippets run as printed
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        run: >-
          node scripts/run-doc-snippets.mjs
          "$RUNNER_TEMP"/open-e2ee-signal-protocol-sdk-*.tgz

  # The hosts checks run as three parallel legs, each from its own packed
  # package. In one job they ran in series and took about 5 minutes.
  react-native-hosts-leg:
    name: React Native and Expo hosts install and bundle the package (${{ matrix.leg }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        leg: [peer ranges, Expo bundles, bare React Native bundle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        id: node
        uses: ./.github/actions/node

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: node_modules
          key: ${{ steps.node.outputs.node-modules-key }}

      - name: Install from the committed lockfile
        uses: ./.github/actions/install
        with:
          cache-hit: ${{ steps.node-modules.outputs.cache-hit }}

      - name: Save node_modules
        if: steps.node-modules.outcome == 'success' && steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      # The npm download cache serves the example installs in the smoke
      # scripts below. The time bound also applies to the save at the end of
      # the job. When the cache service is slow, the job goes on without the
      # cache.
      - name: Restore the npm download cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/expo/package-lock.json
            examples/react-native/package-lock.json

      - name: Build and pack
        run: |
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      # Adds the package to a project on each supported React Native and Expo
      # line, without --force or --legacy-peer-deps, and requires a refusal
      # below the peer floor.
      - name: Resolve the peer ranges on each supported line
        if: matrix.leg == 'peer ranges'
        run: >-
          node scripts/smoke-react-native-install.mjs
          "$RUNNER_TEMP"/open-e2ee-signal-protocol-sdk-*.tgz

      # Builds the Expo example's Android bundle with the packed package and
      # checks that the bytecode comes from the Hermes compiler that
      # React Native pins.
      - name: Bundle the Expo example with Hermes on Expo SDK 57
        if: matrix.leg == 'Expo bundles'
        run: >-
          node scripts/smoke-expo-bundle.mjs
          "$RUNNER_TEMP"/open-e2ee-signal-protocol-sdk-*.tgz 57

      - name: Bundle the Expo example with Hermes on Expo SDK 55
        if: matrix.leg == 'Expo bundles'
        run: >-
          node scripts/smoke-expo-bundle.mjs
          "$RUNNER_TEMP"/open-e2ee-signal-protocol-sdk-*.tgz 55

      # Builds the bare React Native example's Android release bundle with the
      # packed package and the stock Babel preset, compiles it with the Hermes
      # compiler that React Native pins, and lists the public entries that the
      # bundle holds.
      - name: Bundle the bare React Native example with Hermes
        if: matrix.leg == 'bare React Native bundle'
        run: >-
          node scripts/smoke-react-native-bundle.mjs
          "$RUNNER_TEMP"/open-e2ee-signal-protocol-sdk-*.tgz

  # One verdict for the hosts legs under the name and id the single job had.
  # It fails unless `changes` succeeded and every leg succeeded. On a change
  # to documentation only, it requires the legs to skip. It skips on a draft
  # by its own condition: `!cancelled()` alone would run it, and it would
  # fail.
  react-native-hosts:
    name: React Native and Expo hosts install and bundle the package
    needs: [changes, react-native-hosts-leg]
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every leg
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LEGS: ${{ needs.react-native-hosts-leg.result }}
        run: |
          echo "Classification: $CHANGES, code=$CODE. Leg results: $LEGS"
          test "$CHANGES" = success
          case "$CODE" in
            true) test "$LEGS" = success ;;
            false) test "$LEGS" = skipped ;;
            *) exit 1 ;;
          esac
