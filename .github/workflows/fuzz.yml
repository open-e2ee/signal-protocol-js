name: Parser fuzzing

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzzing:
    name: Fuzz ${{ matrix.target }}
    # A draft pull request skips the job. It runs when the pull request is
    # marked ready for review.
    if: >-
      github.repository == 'open-e2ee/signal-protocol-js'
      && github.event.pull_request.draft != true
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - base64
          - sealed-sender
          - sender-key-message
          - session-record
          - signal-message
          - spqr-wire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1

      - name: Report Node.js version
        run: node --version
      # The time bound also applies to the save at the end of the job. When
      # the cache service is slow, the job goes on without the cache.
      - name: Restore the npm download cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fuzz/tooling/package-lock.json
      - name: Install and build
        run: |
          npm ci --ignore-scripts
          npm run build
          npm ci --prefix fuzz/tooling --ignore-scripts
      - name: Fuzz for 150 seconds
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-artifacts"
          node fuzz/tooling/node_modules/@jazzer.js/core/dist/cli.js "fuzz/fuzz-$FUZZ_TARGET.js" --sync -- -max_total_time=150 -timeout=10 -artifact_prefix="$RUNNER_TEMP/fuzz-artifacts/"
      - name: Save crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: ${{ runner.temp }}/fuzz-artifacts/
          if-no-files-found: ignore
