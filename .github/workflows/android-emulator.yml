name: Android emulator

# A release build and an emulator boot cost about 20 runner minutes, so this
# runs on main only when a change can reach the React Native runtime: the
# platform adapters, the cryptography they call, the dependency set, the
# examples, the Hermes gate flows, and this pipeline. A pull request that needs device evidence before
# merge runs it by hand: gh workflow run android-emulator.yml --ref <branch>.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-emulator.yml
      - device/**
      - examples/expo/**
      - examples/react-native/**
      - hermes-tests/**
      - hooks/**
      - internal/crypto/**
      - local/store/expo/**
      - local/store/key-value/**
      - local/store/react-native/**
      - local/store/sqlite/**
      - local/vault/**
      - package-lock.json
      - package.json
      - scripts/example-packed-sdk.mjs
      - scripts/prefetch-android-sdk.mjs
      - scripts/run-android-example.mjs
      - scripts/verify-bare-react-native-example.mjs
      - tsconfig.build.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  expo-release:
    name: Expo example release build on Hermes
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The native build and the emulator system image do not both fit on the
      # runner's free disk. None of these toolchains is used by this job.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/share/boost /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      # The cache steps below have a time bound, which also applies to their
      # saves at the end of the job. When the cache service is slow, the job
      # goes on without the cache.
      - name: Restore the npm download cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/expo/package-lock.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      # The key names the files that pick the Gradle dependencies. Another
      # key of the same job restores a warm Gradle home when they change.
      - name: Restore the Gradle home
        id: gradle-home
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-expo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('examples/expo/package-lock.json', 'examples/expo/app.json') }}
          restore-keys: gradle-expo-${{ runner.os }}-${{ runner.arch }}-

      # The restore sets `cache-matched-key` only after it extracted the whole
      # archive. A download or an extraction that stops part of the way ends
      # the step with success, but it can leave partial files.
      - name: Discard a partial Gradle home
        if: steps.gradle-home.outputs.cache-matched-key == ''
        run: rm -rf ~/.gradle/caches ~/.gradle/wrapper

      # The setup-gradle cache sets no output that tells a complete restore
      # from a partial one, so the steps above and below cache the Gradle
      # home. setup-gradle validates the Gradle wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: external

      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts

      - name: Build and pack
        run: |
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      # The example pins the published SDK. The packed build replaces it, so
      # the app runs the code under review, also before a release publishes.
      - name: Install the example with the packed SDK
        run: node scripts/example-packed-sdk.mjs examples/expo "$RUNNER_TEMP"/open-e2ee-signal-protocol-sdk-*.tgz

      - name: Generate the Android project
        working-directory: examples/expo
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild --platform android --no-install

      # The Android Gradle plugin downloads a missing SDK package once, and
      # fails the build after a failed or corrupt download. This step installs
      # the packages that the build uses, and tries again after a failed
      # download. It uses the Gradle arguments of the build step.
      - name: Install the Android SDK packages of the build
        timeout-minutes: 20
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
        run: node scripts/prefetch-android-sdk.mjs examples/expo/android assembleRelease -PreactNativeArchitectures=x86_64

      - name: Build the release APK for x86_64
        working-directory: examples/expo/android
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64

      # The APK is the only build output that the emulator needs.
      - name: Delete the native build intermediates
        working-directory: examples/expo
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
          (cd android && ./gradlew --stop)
          rm -rf android/build android/app/build android/app/.cxx
          find node_modules -type d \( -name .cxx -o -path '*/android/build' \) -prune -exec rm -rf {} +
          df -h /

      # After a hit, the key is already in the cache. The save comes after
      # `gradlew --stop`, so no Gradle daemon writes to the Gradle home.
      - name: Save the Gradle home
        if: steps.gradle-home.outcome == 'success' && steps.gradle-home.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-home.outputs.cache-primary-key }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A Blacksmith sticky disk keeps the emulator system image, so the
      # emulator step does not download it again. The disk key names the
      # system image of the emulator step, so change both together. Every job
      # that runs the same image shares the disk. The disk is committed only
      # when its content changed, and only when no step failed. When the mount
      # fails, or the runner is not a Blacksmith runner, the action makes an
      # empty directory and the emulator step downloads the image.
      - name: Name the system image directory
        id: system-images
        run: echo "path=$ANDROID_HOME/system-images" >> "$GITHUB_OUTPUT"

      - name: Mount the system image disk
        id: system-image-disk
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        timeout-minutes: 2
        continue-on-error: true
        with:
          key: ${{ github.repository }}-android-36-google_apis-x86_64-system-image
          path: ${{ steps.system-images.outputs.path }}
          commit: on-change

      # A mount that stops part of the way can leave a directory that the
      # runner user cannot write.
      - name: Discard a partial mount
        if: steps.system-image-disk.outcome == 'failure'
        env:
          DIR: ${{ steps.system-images.outputs.path }}
        run: |
          sudo umount "$DIR" || true
          sudo rm -rf "$DIR"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$DIR"

      - name: Run the example twice on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: node scripts/run-android-example.mjs expo "$RUNNER_TEMP/app-release.apk" "$RUNNER_TEMP/logcat.txt"

      - name: Upload the logcat output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-emulator-logcat
          path: ${{ runner.temp }}/logcat.txt
          if-no-files-found: ignore

  react-native-release:
    name: Bare React Native example release build on Hermes
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The native build and the emulator system image do not both fit on the
      # runner's free disk. None of these toolchains is used by this job.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/share/boost /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      # The cache steps below have a time bound, which also applies to their
      # saves at the end of the job. When the cache service is slow, the job
      # goes on without the cache.
      - name: Restore the npm download cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/react-native/package-lock.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      # The key names the files that pick the Gradle dependencies. Another
      # key of the same job restores a warm Gradle home when they change.
      - name: Restore the Gradle home
        id: gradle-home
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-react-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('examples/react-native/package-lock.json', 'examples/react-native/android/**/*.gradle', 'examples/react-native/android/**/*.properties') }}
          restore-keys: gradle-react-native-${{ runner.os }}-${{ runner.arch }}-

      # The restore sets `cache-matched-key` only after it extracted the whole
      # archive. A download or an extraction that stops part of the way ends
      # the step with success, but it can leave partial files.
      - name: Discard a partial Gradle home
        if: steps.gradle-home.outputs.cache-matched-key == ''
        run: rm -rf ~/.gradle/caches ~/.gradle/wrapper

      # The setup-gradle cache sets no output that tells a complete restore
      # from a partial one, so the steps above and below cache the Gradle
      # home. setup-gradle validates the Gradle wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: external

      - name: Check that the example locks no Expo package
        run: node scripts/verify-bare-react-native-example.mjs

      - name: Install from the committed lockfile
