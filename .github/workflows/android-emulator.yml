name: Android emulator

# A release build and an emulator boot cost about 20 runner minutes, so this
# runs on main only when a change can reach the React Native runtime: the
# platform adapters, the cryptography they call, the dependency set, the
# examples, the Hermes gate flows, and this pipeline. A pull request that needs device evidence before
# merge runs it by hand: gh workflow run android-emulator.yml --ref <branch>.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-emulator.yml
      - device/**
      - examples/expo/**
      - examples/react-native/**
      - hermes-tests/**
      - hooks/**
      - internal/crypto/**
      - local/store/expo/**
      - local/store/key-value/**
      - local/store/react-native/**
      - local/store/sqlite/**
      - local/vault/**
      - package-lock.json
      - package.json
      - scripts/example-packed-sdk.mjs
      - scripts/run-android-example.mjs
      - scripts/verify-bare-react-native-example.mjs
      - tsconfig.build.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  expo-release:
    name: Expo example release build on Hermes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The native build and the emulator system image do not both fit on the
      # runner's free disk. None of these toolchains is used by this job.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/share/boost /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/expo/package-lock.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts

      - name: Build and pack
        run: |
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      # The example pins the published SDK. The packed build replaces it, so
      # the app runs the code under review, also before a release publishes.
      - name: Install the example with the packed SDK
        run: node scripts/example-packed-sdk.mjs examples/expo "$RUNNER_TEMP"/open-e2ee-signal-protocol-sdk-*.tgz

      - name: Build the release APK for x86_64
        working-directory: examples/expo
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64

      # The APK is the only build output that the emulator needs.
      - name: Delete the native build intermediates
        working-directory: examples/expo
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
          (cd android && ./gradlew --stop)
          rm -rf android/build android/app/build android/app/.cxx
          find node_modules -type d \( -name .cxx -o -path '*/android/build' \) -prune -exec rm -rf {} +
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the example twice on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: node scripts/run-android-example.mjs expo "$RUNNER_TEMP/app-release.apk" "$RUNNER_TEMP/logcat.txt"

      - name: Upload the logcat output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-emulator-logcat
          path: ${{ runner.temp }}/logcat.txt
          if-no-files-found: ignore

  react-native-release:
    name: Bare React Native example release build on Hermes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The native build and the emulator system image do not both fit on the
      # runner's free disk. None of these toolchains is used by this job.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/share/boost /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/react-native/package-lock.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check that the example locks no Expo package
        run: node scripts/verify-bare-react-native-example.mjs

      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts

      - name: Build and pack
        run: |
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      # The example pins the published SDK. The packed build replaces it, so
      # the app runs the code under review, also before a release publishes.
      - name: Install the example with the packed SDK
        run: node scripts/example-packed-sdk.mjs examples/react-native "$RUNNER_TEMP"/open-e2ee-signal-protocol-sdk-*.tgz

      # Metro bundles the gate's own flow modules into the app when the
      # checkout has the gate. The sealed-sender flow reads a fixture that
      # Node writes before the bundle.
      - name: Write the Hermes gate fixtures
        run: |
          if [ -f hermes-tests/fixtures.mjs ]; then
            node hermes-tests/fixtures.mjs
          else
            echo "The Hermes gate flows run only in the private repository. The app runs its own checks."
          fi

      - name: Build the release APK for x86_64
        working-directory: examples/react-native/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64

      # The APK is the only build output that the emulator needs.
      - name: Delete the native build intermediates
        working-directory: examples/react-native
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
          (cd android && ./gradlew --stop)
          rm -rf android/build android/app/build android/app/.cxx
          find node_modules -type d \( -name .cxx -o -path '*/android/build' \) -prune -exec rm -rf {} +
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the example twice on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: node scripts/run-android-example.mjs react-native "$RUNNER_TEMP/app-release.apk" "$RUNNER_TEMP/logcat.txt"

      - name: Upload the logcat output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-emulator-logcat-react-native
          path: ${{ runner.temp }}/logcat.txt
          if-no-files-found: ignore
