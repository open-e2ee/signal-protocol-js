name: Scorecard

# OpenSSF Scorecard supply-chain analysis of the published repository.
#
# This file is exported verbatim, so it exists in both repositories, but
# Scorecard only works on the public one: its analysis reads the repository
# over the public API and the action's checkout resolves to "repository not
# found" against the private source of truth. Left unguarded it fails on every
# push here, which trains everyone to ignore a red X. The job guard below is
# the whole fix -- it is true in the published repository and false here.
on:
  schedule:
    - cron: '30 7 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'open-e2ee/signal-protocol-js'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
