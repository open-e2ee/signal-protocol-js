name: Publish

# Never runs on push. Publication happens only when a release is published or a
# maintainer dispatches this workflow deliberately.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Resolve and pack without publishing
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance: the registry verifies a signed statement about
  # the workflow, repository, and commit that produced the package.
  id-token: write

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release jobs use no npm cache. A hit saved no measurable time
      # there, and a release does not wait on the cache service.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Use the qualified publication runtime.
          node-version: 26.8.2
          registry-url: https://registry.npmjs.org

      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Pack the client package
        id: package
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/packed.json"
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const [packed] = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'packed.json'), 'utf8'));
          console.log(`Verified ${packed.name}@${packed.version}: ${packed.integrity}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `path=${join(process.env.RUNNER_TEMP, packed.filename)}\n`);
          JS

      - name: Publish
        if: ${{ !inputs.dry-run }}
        env:
          SDK_PACKAGE_PATH: ${{ steps.package.outputs.path }}
        # Dist-tag policy, applied at publish time because OIDC trusted-publishing
        # credentials cover the publish operation only (no post-hoc dist-tag moves):
        #   - stable versions publish to `latest`;
        #   - prereleases publish to `latest` while NO stable release exists on the
        #     registry (the newest alpha is the best available build), and to their
        #     prerelease identifier (0.1.0-alpha.4 -> alpha) once a stable exists,
        #     so `latest` is never downgraded to a prerelease after 1.0.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          TAG=latest
          case "$VERSION" in
            *-*)
              # Fail closed: only an explicit E404 (package never published) may
              # be read as "no stable release exists". Any other lookup failure
              # aborts the publish rather than risking a prerelease overwriting
              # a stable `latest` on the strength of a transient registry error.
              #
              # stderr must be kept OUT of the captured value. npm writes config
              # warnings there unconditionally -- the runner's own npmrc triggers
              # `Unknown user config "always-auth"` -- and that text contains a
              # hyphen, so folding it into CURRENT_LATEST makes the `*-*`
              # prerelease test below match the warning rather than the version.
              # That would silently republish `latest` from a prerelease once a
              # stable exists, which is exactly what this block exists to prevent.
              NPM_VIEW_ERR=$(mktemp)
              if CURRENT_LATEST=$(npm view "$NAME" dist-tags.latest 2>"$NPM_VIEW_ERR"); then
                :
              elif grep -q "E404" "$NPM_VIEW_ERR"; then
                CURRENT_LATEST=""
              else
                echo "::error::registry dist-tags lookup failed; refusing to guess."
                cat "$NPM_VIEW_ERR"
                exit 1
              fi
              # Trim stray whitespace/newlines so the glob tests below see a bare version.
              CURRENT_LATEST=$(printf '%s' "$CURRENT_LATEST" | tr -d '[:space:]')
              case "$CURRENT_LATEST" in
                ""|*-*) TAG=latest;;
                *) TAG="${VERSION#*-}"; TAG="${TAG%%.*}";;
              esac
              ;;
          esac
          echo "Publishing $VERSION with dist-tag $TAG (registry latest: ${CURRENT_LATEST:-n/a})"
          npm publish "$SDK_PACKAGE_PATH" --provenance --access public --tag "$TAG"
          # Best-effort: keep the prerelease channel tag current when a prerelease
          # ships to latest. May be refused under OIDC scoping; never fails the job.
          case "$VERSION" in
            *-*)
              if [ "$TAG" = "latest" ]; then
                CHANNEL="${VERSION#*-}"; CHANNEL="${CHANNEL%%.*}"
                npm dist-tag add "$NAME@$VERSION" "$CHANNEL" || echo "::warning::could not update '$CHANNEL' dist-tag (OIDC scope); harmless"
              fi
              ;;
          esac
        # No token: authentication is npm Trusted Publishing (OIDC) via this
        # workflow's id-token permission and the npm-publish environment, which
        # must both match the trusted-publisher configuration on npmjs.com.

  sbom:
    name: Attach SBOM to the release
    needs: publish
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2

      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.cdx.json --clobber
