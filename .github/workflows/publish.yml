name: Publish

# Never runs on push. Publication happens only when a release is published or a
# maintainer dispatches this workflow deliberately.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Resolve and pack without publishing
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance: the registry verifies a signed statement about
  # the workflow, repository, and commit that produced the package.
  id-token: write

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Pack only
        if: inputs.dry-run
        run: npm pack --dry-run

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
