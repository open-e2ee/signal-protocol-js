name: Publish

# Never runs on push. Publication happens only when a release is published or a
# maintainer dispatches this workflow deliberately.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Resolve and pack without publishing
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance: the registry verifies a signed statement about
  # the workflow, repository, and commit that produced the package.
  id-token: write

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the npm major used by the release-export pipeline (see ci.yml).
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Pack only
        if: inputs.dry-run
        run: npm pack --dry-run

      - name: Publish
        if: ${{ !inputs.dry-run }}
        # Dist-tag policy, applied at publish time because OIDC trusted-publishing
        # credentials cover the publish operation only (no post-hoc dist-tag moves):
        #   - stable versions publish to `latest`;
        #   - prereleases publish to `latest` while NO stable release exists on the
        #     registry (the newest alpha is the best available build), and to their
        #     prerelease identifier (0.1.0-alpha.4 -> alpha) once a stable exists,
        #     so `latest` is never downgraded to a prerelease after 1.0.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          TAG=latest
          case "$VERSION" in
            *-*)
              # Fail closed: only an explicit E404 (package never published) may
              # be read as "no stable release exists". Any other lookup failure
              # aborts the publish rather than risking a prerelease overwriting
              # a stable `latest` on the strength of a transient registry error.
              if CURRENT_LATEST=$(npm view "$NAME" dist-tags.latest 2>&1); then
                :
              elif printf '%s' "$CURRENT_LATEST" | grep -q "E404"; then
                CURRENT_LATEST=""
              else
                echo "::error::registry dist-tags lookup failed; refusing to guess. Output: $CURRENT_LATEST"
                exit 1
              fi
              case "$CURRENT_LATEST" in
                ""|*-*) TAG=latest;;
                *) TAG="${VERSION#*-}"; TAG="${TAG%%.*}";;
              esac
              ;;
          esac
          echo "Publishing $VERSION with dist-tag $TAG (registry latest: ${CURRENT_LATEST:-n/a})"
          npm publish --provenance --access public --tag "$TAG"
          # Best-effort: keep the prerelease channel tag current when a prerelease
          # ships to latest. May be refused under OIDC scoping; never fails the job.
          case "$VERSION" in
            *-*)
              if [ "$TAG" = "latest" ]; then
                CHANNEL="${VERSION#*-}"; CHANNEL="${CHANNEL%%.*}"
                npm dist-tag add "$NAME@$VERSION" "$CHANNEL" || echo "::warning::could not update '$CHANNEL' dist-tag (OIDC scope); harmless"
              fi
              ;;
          esac
        # No token: authentication is npm Trusted Publishing (OIDC) via this
        # workflow's id-token permission and the npm-publish environment, which
        # must both match the trusted-publisher configuration on npmjs.com.

  sbom:
    name: Attach SBOM to the release
    needs: publish
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.cdx.json --clobber
