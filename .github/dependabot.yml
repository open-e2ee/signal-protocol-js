# Dependency updates for the public repository.
#
# This repo is a mechanized export, so dependabot PRs here cannot merge to
# main directly (see CONTRIBUTING.md) — they serve as public, visible alerts.
# The corresponding bumps land in the internal repository and arrive in the
# next release export.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: production
  # One pull request holds every action bump. An action with sub-actions,
  # such as github/codeql-action/init and github/codeql-action/analyze, must
  # move all its pins to one commit, and CodeQL fails on a pull request that
  # moves only some of them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /fuzz/tooling
    schedule:
      interval: weekly
