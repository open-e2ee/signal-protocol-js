name: Install from the committed lockfile
description: >-
  Install node_modules from package-lock.json with `npm ci --ignore-scripts`,
  less the mobile native binaries. A job with a cache hit skips the install.

# A composite step cannot take `timeout-minutes`. So the cache restore and save
# of node_modules are workflow steps around this action, each with
# `timeout-minutes: 2` and `continue-on-error: true`, so each step waits at
# most 2 minutes for a slow cache service. .github/actions/node names the
# cache key. The save runs right after this action, and only after a restore
# that did not fail. The saved tree is therefore the install output, and never
# a tree that a later step of the job changed. After every restore other than
# a hit, the job installs. A restore that stops part of the way sets no
# `cache-hit`, and `npm ci` deletes node_modules first, so no partial file
# from the restore stays.

inputs:
  cache-hit:
    description: >-
      The `cache-hit` output of the node_modules restore. The value 'true'
      skips the install.
    default: 'false'

runs:
  using: composite
  steps:
    # The committed lockfile installs with npm 11. Node 22 bundles npm 10.
    - if: inputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ "$(npm --version | cut -d. -f1)" -lt 11 ]; then
          npm install --global npm@11
        fi
        npm ci --ignore-scripts

    # `--ignore-scripts` skips realm's install script, which downloads the
    # Node binary that the Realm adapter tests open a real Realm file with.
    # Run the download here instead, so the cache holds the binary. The
    # install script itself swallows a failed download with `|| echo`, so
    # this step calls prebuild-install directly, and a failed download fails
    # the job. The public export has no realm, so there the step does
    # nothing. prebuild-install sends no analytics. The variable also keeps
    # realm's analytics script off if a change makes this step run it.
    - if: inputs.cache-hit != 'true'
      shell: bash
      env:
        REALM_DISABLE_ANALYTICS: '1'
      run: |
        if [ -d node_modules/realm ]; then
          cd node_modules/realm
          ../.bin/prebuild-install --runtime napi
        fi

    # realm and op-sqlite ship their Android and Apple native binaries in the
    # npm package, about 970 MB of the 1.8 GB tree. No job that uses this
    # action builds a native mobile app, and the React Native bundles read only
    # JavaScript, so this step deletes the binaries before the save. A hit then
    # restores about half the bytes. The job that installs on a miss deletes
    # them too, so a hit and a miss give the same tree.
    - if: inputs.cache-hit != 'true'
      shell: bash
      run: |
        rm -rf \
          node_modules/realm/prebuilds/android \
          node_modules/realm/prebuilds/apple \
          node_modules/@op-engineering/op-sqlite/android \
          node_modules/@op-engineering/op-sqlite/ios
